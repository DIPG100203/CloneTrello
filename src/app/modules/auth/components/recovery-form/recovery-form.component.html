<h1 class="font-bold text-blue-600 text-base text-center pb-7">
  Establece tu nueva contraseña
</h1>
<form action="" class="space-y-4">
  <!-- PRIMER INPUT PASSWORD -->
  <div>
    <div class="relative">
      <input
        class="w-full bg-gray-50 rounded border-2 border-gray-300"
        type="text"
      />
      <button type="button" class="text-gray-500 p-2 absolute right-2">
        <fa-icon [icon]="faEye"></fa-icon>
      </button>
    </div>
    <div>
      <p class="font-medium text-red-500 text-xs mt-1 ml-1">
        Este campo es obligatorio
      </p>
      <p class="font-medium text-red-500 text-xs mt-1 ml-1">
        Este campo debe ser un correo electrónico.
      </p>
    </div>
  </div>
  <!-- FIN DEL PRIMER INPUT -->

  <!-- INICIO DEL SEGUNDO INPUT -->
  <div>
    <div class="relative">
      <input
        class="w-full bg-slate-50 rounded border-2 border-gray-300"
        type="password"
      />
    </div>
    <div>
      <p class="font-medium text-red-500 text-xs mt-1 ml-1">
        Este campo es obligatorio
      </p>
      <p class="font-medium text-red-500 text-xs mt-1 ml-1">
        Este campo debe ser un correo electrónico.
      </p>
    </div>
  </div>
  <!-- FIN DEL SEGUN INPUT -->
  <div>
    <p class="font-medium text-red-500 text-xs mt-1 ml-1">
      La contraseña no es la misma
    </p>
  </div>

  <!-- BUTTON -->
  <div class="relative">
    <app-btn routerLink="/app/boards" [typeBtn]="'submit'"
      >Recuperación</app-btn
    >
  </div>
</form>
